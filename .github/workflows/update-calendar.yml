name: Uppdatera iCloud-kalender

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4
        
      - name: Installera Python-beroenden
        run: pip install openpyxl
        
      - name: Hämta iCloud-kalender
        env:
          ICLOUD_CALENDAR_URL: ${{ secrets.ICLOUD_CALENDAR_URL }}
        run: python .github/scripts/fetch_calendar.py

      - name: Hämta matsedel
        run: python .github/scripts/fetch_menu.py

      - name: Hämta Resursteam
        run: python fetch_resursteam.py

      - name: Publicera kalender och matsedel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json menu.json resursteam.json
          git diff --cached --quiet || git commit -m "Uppdatera kalender och matsedel"
          git push
