name: Uppdatera iCloud-kalender

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

- name: Hämta iCloud-kalender
  env:
    ICLOUD_CALENDAR_URL: ${{ secrets.ICLOUD_CALENDAR_URL }}
    ICLOUD_WORK_CALENDAR_URL: ${{ secrets.ICLOUD_WORK_CALENDAR_URL }}
  run: python .github/scripts/fetch_calendar.py

      - name: Publicera kalenderdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || git commit -m "Uppdatera kalender"
          git push
