name: Uppdatera Resursteamet

on:
  workflow_dispatch:

  push:
    paths:
      - 'Uppdrag.xlsx'
      - 'fetch_resursteam.py'

  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-resursteam:
    runs-on: ubuntu-latest

    steps:

      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera bibliotek
        run: |
          pip install openpyxl

      - name: Uppdatera Resursteamet
        run: |
          python fetch_resursteam.py

      - name: Kontrollera förändringar
        id: changes
        run: |
          git diff --quiet resursteam.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Spara uppdaterad information
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add resursteam.json
          git commit -m "Automatisk uppdatering av Resursteamet"
          git push
